# 9. Pause/resume: no gameplay while paused; resume restores the turn.
appId: com.boardgamebank.businessbanker
---
- runFlow: subflows/host_game_with_bot.yaml
- tapOn:
    id: open-more
- tapOn:
    id: pause-button
- extendedWaitUntil:
    visible:
      id: context-paused
    timeout: 15000
- assertNotVisible:
    id: roll-button
- tapOn:
    id: resume-button
- extendedWaitUntil:
    visible:
      id: roll-button
    timeout: 15000
