# 4. Roll: server rolls, the turn bar shows dice total and destination.
appId: com.boardgamebank.businessbanker
---
- runFlow: subflows/host_game_with_bot.yaml
- tapOn:
    id: roll-button
- extendedWaitUntil:
    visible:
      id: turn-detail
      text: 'Turn \d+ · 🎲 \d+ → .*'
    timeout: 15000
- assertNotVisible:
    id: roll-button
