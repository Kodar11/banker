# 5. Buy property: play turns until the app lands on an unowned property, then buy it.
appId: com.boardgamebank.businessbanker
---
- runFlow: subflows/host_game_with_bot.yaml
- repeat:
    times: 15
    while:
      notVisible:
        id: buy-button
    commands:
      - tapOn:
          id: roll-button
      - extendedWaitUntil:
          notVisible:
            id: roll-button
          timeout: 15000
      # A decision (buy / card / payment I can't cover) opens from the turn bar's primary action.
      - runFlow:
          when:
            visible:
              id: turn-choose
          commands:
            - tapOn:
                id: turn-choose
      - runFlow:
          when:
            notVisible:
              id: buy-button
          commands:
            - runFlow: subflows/finish_my_turn.yaml
- assertVisible: '(?i)property available'
- tapOn:
    id: buy-button
- extendedWaitUntil:
    visible: '(?i)tanmay bought .* for ₹.*'
    timeout: 15000
- assertVisible:
    id: end-turn-button
