# 2. Join game: a bot hosts; the app joins with the 6-digit code.
appId: com.clashofcapitals.app
---
- runScript:
    file: scripts/bot.js
    env:
      OP: host
      NAME: Arjun
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
- launchApp:
    clearState: true
# A fresh install opens on the introduction: skip it, the flows below start from Home.
- runFlow:
    when:
      visible:
        id: onboarding-skip
    commands:
      - tapOn:
          id: onboarding-skip
- tapOn:
    id: join-game
- tapOn:
    id: join-code
- inputText: ${output.code}
- tapOn:
    id: join-name
- inputText: Meera
- tapOn:
    id: join-confirm
- extendedWaitUntil:
    visible:
      id: lobby-screen
    timeout: 15000
- assertVisible: Arjun
- assertVisible: '(?i)meera \(you\)'
- tapOn:
    id: ready-button
- extendedWaitUntil:
    visible: "I'M READY ✓"
    timeout: 10000
