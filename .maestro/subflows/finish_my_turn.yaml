# Resolves whatever the app player's roll produced, ends the turn, then the bot plays.
appId: com.boardgamebank.businessbanker
---
# Affordable payments are the turn bar's primary action.
- runFlow:
    when:
      visible:
        id: turn-pay
        enabled: true
    commands:
      - tapOn:
          id: turn-pay
# Decisions (buy, card, payment I can't cover yet) open in the "Your move" sheet.
- runFlow:
    when:
      visible:
        id: turn-choose
    commands:
      - tapOn:
          id: turn-choose
- runFlow:
    when:
      visible:
        id: buy-button
        enabled: true
    commands:
      - tapOn:
          id: buy-button
      - extendedWaitUntil:
          notVisible:
            id: buy-card
          timeout: 15000
- runFlow:
    when:
      visible:
        id: buy-card
    commands:
      - tapOn:
          id: decline-button
      - runFlow: pass_auction.yaml
- runFlow:
    when:
      visible:
        id: pay-button
        enabled: true
    commands:
      - tapOn:
          id: pay-button
- runFlow:
    when:
      visible:
        id: card-none
    commands:
      - tapOn:
          id: card-none
- extendedWaitUntil:
    visible:
      id: end-turn-button
    timeout: 15000
- tapOn:
    id: end-turn-button
- runScript:
    file: ../scripts/bot.js
    env:
      OP: play
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
# If the bot declined a property, this phone is taken to the auction: pass, let the bot finish.
- runFlow:
    when:
      visible:
        id: auction-screen
    commands:
      - tapOn:
          id: pass-button
      - extendedWaitUntil:
          visible:
            id: game-screen
          timeout: 15000
      - runScript:
          file: ../scripts/bot.js
          env:
            OP: play
            SUPABASE_URL: ${SUPABASE_URL}
            SUPABASE_KEY: ${SUPABASE_KEY}
- extendedWaitUntil:
    visible: 'YOUR TURN'
    timeout: 30000
# In Jail (landed on Jail last turn): pay ₹500 to leave so the flow can keep rolling.
- runFlow:
    when:
      visible:
        id: turn-choose
    commands:
      - tapOn:
          id: turn-choose
      - tapOn:
          id: jail-pay
- extendedWaitUntil:
    visible:
      id: roll-button
    timeout: 30000
