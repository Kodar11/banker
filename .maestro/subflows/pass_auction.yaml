appId: com.boardgamebank.businessbanker
---
- extendedWaitUntil:
    visible:
      id: auction-screen
    timeout: 15000
- runScript:
    file: ../scripts/bot.js
    env:
      OP: bid
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
- extendedWaitUntil:
    visible: '(?i)highest bid.*priya.*'
    timeout: 20000
# The countdown is 5 seconds: if it already ran out, the bot has won without our pass.
- runFlow:
    when:
      visible:
        id: pass-button
    commands:
      - tapOn:
          id: pass-button
- extendedWaitUntil:
    visible: '(?i)sold to priya'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: game-screen
    timeout: 15000
