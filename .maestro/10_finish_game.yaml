# 10. Finish game: the host asks for an end-game vote, the other player agrees; winner by net worth is shown.
appId: com.clashofcapitals.app
---
- runFlow: subflows/host_game_with_bot.yaml
- tapOn:
    id: roll-button
- extendedWaitUntil:
    notVisible:
      id: roll-button
    timeout: 15000
- runFlow: subflows/finish_my_turn.yaml
- tapOn:
    id: open-more
- tapOn:
    id: request-end-vote
- tapOn: Start Vote
# Nobody ends the game alone: the vote card is up until the other player has voted.
- extendedWaitUntil:
    visible:
      id: end-vote
    timeout: 15000
- runScript:
    file: scripts/bot.js
    env:
      OP: vote
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
- extendedWaitUntil:
    visible: '(?i).* wins!'
    timeout: 15000
# Game Over is not a dead end: the way back to Home is on screen (Create / Join live there).
- assertVisible:
    id: return-home-button
- assertNotVisible:
    id: new-game-button
- assertNotVisible:
    id: join-another-button
- tapOn:
    id: context-cta
- assertVisible:
    id: finished-card
