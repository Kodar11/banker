# 10. Finish game: host ends the game; winner by net worth is shown.
appId: com.boardgamebank.businessbanker
---
- runFlow: subflows/host_game_with_bot.yaml
- tapOn:
    id: roll-button
- extendedWaitUntil:
    notVisible:
      id: roll-button
    timeout: 15000
- runFlow: subflows/finish_my_turn.yaml
- tapOn:
    id: open-more
- tapOn:
    id: end-game-button
- tapOn: End game
- extendedWaitUntil:
    visible: '(?i).* wins!'
    timeout: 15000
# Game Over is not a dead end: the way back to Home is on screen (Create / Join live there).
- assertVisible:
    id: return-home-button
- assertNotVisible:
    id: new-game-button
- assertNotVisible:
    id: join-another-button
- tapOn:
    id: context-cta
- assertVisible:
    id: finished-card
