# 7. Auction: app declines a property, bot bids, app passes, bot wins and pays.
appId: com.boardgamebank.businessbanker
---
- runFlow: subflows/host_game_with_bot.yaml
- repeat:
    times: 12
    while:
      notVisible:
        id: buy-card
    commands:
      - tapOn:
          id: roll-button
      - extendedWaitUntil:
          notVisible:
            id: roll-button
          timeout: 15000
      # A decision (buy / card / payment I can't cover) opens from the turn bar's primary action.
      - runFlow:
          when:
            visible:
              id: turn-choose
          commands:
            - tapOn:
                id: turn-choose
      - runFlow:
          when:
            notVisible:
              id: buy-card
          commands:
            - runFlow: subflows/finish_my_turn.yaml
- tapOn:
    id: decline-button
- runFlow: subflows/pass_auction.yaml
- assertVisible: '(?i)priya won .* for ₹.*'
